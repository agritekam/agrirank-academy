<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester 1 | AgriRank Academy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f8f5;
}

header{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    width:90%;
    max-width:800px;
    margin:40px auto;
}

.search-box{
    width:100%;
    padding:12px;
    border:2px solid #2e7d32;
    border-radius:8px;
    font-size:16px;
    margin-bottom:30px;
}

.message{
    background:white;
    padding:40px 20px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.message h2{
    color:#2e7d32;
    margin-bottom:15px;
}

.message p{
    color:#555;
    font-size:18px;
}

.home-btn{
    display:block;
    width:220px;
    margin:35px auto;
    text-align:center;
    background:#1565c0;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

.home-btn:hover{
    background:#0d47a1;
}

footer{
    margin-top:50px;
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>
<body>

<header>
<h1>🌾 AgriRank Academy</h1>
<p>Semester 1</p>
</header>

<div class="container">

<input type="text" class="search-box" placeholder="Search Notes (Coming Soon)" disabled>

<div class="message">
<h2>📚 Notes Coming Soon</h2>
<p>Semester 1 notes will be uploaded very soon.</p>
</div>

<a href="index.html" class="home-btn">⬅ Back to Home</a>

</div>

<footer>
© 2026 AgriRank Academy | All Rights Reserved
</footer>

</body>
</html>
